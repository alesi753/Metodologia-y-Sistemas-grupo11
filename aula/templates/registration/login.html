{% extends 'aula/base.html' %}

{% block titulo %}Ingresar{% endblock %}

{% block contenido %}
<article>
  <h2>Ingresar</h2>
  {% if form.errors %}
  <p>Legajo o contraseña incorrectos.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Legajo {{ form.username }}</label>
    <label>Contraseña {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button>Ingresar</button>
  </form>
</article>
{% endblock %}
